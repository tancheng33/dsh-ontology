# The configuration layer this bundle contributes when a profile lists it.
# Users override any key here from their own profile `cordis.patch.yml`.

# The ontology is durable and needs the storage stack (`dsh-storage`,
# `dsh-storage-json`, `dsh-storage-domain`). Since dsh-base 0.1.5 that stack is
# part of `dsh-base`, which every profile ships, so this bundle contributes only
# its own row. Plain `insert:` lists are appended, not deduplicated by id, so
# re-inserting the storage rows here would make the loader throw
# `duplicate loader entry id: storage` at boot (issue #1). Change the medium by
# overriding `storage-json` (or replacing it with `dsh-storage-sqlite`) in your
# own profile patch.
- insert:
    - id: ontology
      name: dsh-ontology
      config:
        # Which storage domain name the ontology persists under. One name is
        # one graph; insert the row twice with different names for two
        # isolated graphs.
        domain: ontology
        # Reject assertions that violate the declared vocabulary. `false`
        # records the violation on the stored fact instead of refusing it,
        # which suits exploratory modelling.
        strict: true
        # Materialize inverse / symmetric / transitive entailments on query.
        inference: true
        # Cap on derived facts per read; past it, inferred results are marked
        # incomplete. Raise for graphs with large transitive closures.
        maxInferred: 20000
        # Contribute a vocabulary summary to the system prompt so the model
        # knows the graph exists and what terms it already has.
        promptSection: true
        # Upper bound on classes + relations listed in that summary.
        promptMaxTerms: 60
        # Where the section lands in the assembled prompt (tool guidance is
        # conventionally 100–199).
        promptOrder: 150
        # Default and maximum result size for one query.
        defaultLimit: 50
        maxLimit: 500
        # Capacity guards; an assertion past the bound fails loudly.
        maxEntities: 20000
        maxFacts: 100000
