name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field, so CI and local
      # development record identical lockfile settings.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts` skips the package's own `prepare` build; the build
      # step below runs it explicitly so a failure is attributed to the build.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
